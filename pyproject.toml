[project]
name = "papermind-kg-rag"
description = "Agentic research assistant using Knowledge Graphs, Hybrid RAG, Neo4j, FAISS, LangGraph, Groq, and Gemini."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.14.2",
    "groq>=1.4.0",
    "loguru>=0.7.3",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
]

