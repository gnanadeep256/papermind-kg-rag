project:
  name: papermind-kg-rag
  version: 0.1.0
  last_updated: auto

data:
  raw_dir: data/raw
  processed_dir: data/processed
  vectorstore_dir: data/vectorstore

arxiv:
  categories:
    - cs.AI
    - cs.CL
  max_results: 100
  download_pdfs: false

embeddings:
  model_name: BAAI/bge-small-en-v1.5
  chunk_size: 500
  chunk_overlap: 50

neo4j:
  uri: bolt://localhost:7687
  database: neo4j

llm:
  reasoning_provider: groq
  reasoning_model: llama-3

  extraction_provider: groq
  extraction_model: qwen/qwen3-32b

  temperature: 0.0

api:
  host: 0.0.0.0
  port: 8000

extraction:
  max_papers: 10
  pause_seconds: 3.0
  request_delay_seconds: 1.0

retrieval:
  enable_cross_encoder: false
  cross_encoder_model: BAAI/bge-reranker-base
  semantic_weight: 0.80
  graph_weight: 0.20
  top_k_entity_matches: 5
  relative_threshold: 0.90
  min_words_evidence_budget: 1200
  policies:
    dataset:
      ranking:
        semantic: 0.70
        graph_overlap: 0.30
      thresholds:
        semantic: 0.68
        overlap: 0.10
      budgeting:
        min_words: 1200
    method:
      ranking:
        semantic: 0.70
        graph_overlap: 0.30
      thresholds:
        semantic: 0.70
        overlap: 0.00
      budgeting:
        min_words: 1200
    paper:
      ranking:
        semantic: 0.70
        graph_overlap: 0.30
      thresholds:
        semantic: 0.65
        overlap: 0.00
      budgeting:
        min_words: 1200
    research:
      ranking:
        semantic: 0.70
        graph_overlap: 0.30
      thresholds:
        semantic: 0.60
        overlap: 0.00
      budgeting:
        min_words: 1200
  token_budget:
    paper: 6000
    method: 5000
    dataset: 4000
    research: 6000
  citation_alignment:
    warning_threshold: 0.65
    reject_threshold: 0.50
  replace_invalid_citations: true

generation:
  debug_mode: true
  semantic_drift_threshold: 0.55
  weights:
    semantic: 0.45
    graph: 0.20
    citation_coverage: 0.10
    citation_precision: 0.10
    rerank: 0.15

evaluation:
  version: "1.0.0"
  embedding_model_provenance: "BAAI/bge-small-en-v1.5"
  judge_model_provenance: "Gemini 2.5 Flash"
  fallback_judge_provenance: "Llama-3.3-70B"
  latency_target_ms: 8000 # Max target latency before penalty
  min_grounding_threshold: 0.65
  calibration_bins: 5
  bootstrap:
    num_resamples: 1000
    confidence_level: 0.95
    random_seed: 42
  benchmark_score:
    retrieval: 0.20
    citation: 0.20
    faithfulness: 0.25
    groundedness: 0.15
    abstention: 0.10
    latency: 0.10
  cache:
    invalidation_strategy: "lru" # Options: aggressive, keep_all, lru, ttl
    max_models: 3
    max_age_days: 30
  category_weights:
    dataset: 0.10
    comparison: 0.10
    ood: 0.05
    hallucination_trap: 0.05
    summary: 0.10
    workflow: 0.05
    future_work: 0.05
    limitations: 0.05
    experimental_results: 0.05
    multi_hop: 0.10
    citation_verification: 0.05
    paper: 0.10
    entity_linking: 0.05
    method: 0.10

observability:
  enabled: true
  trace_format: "jsonl"      # Options: json, jsonl
  compress: true            # Compresses traces to .gz format
  save_prompt_text: false   # Avoids dumping massive LLM prompt strings
  save_prompt_hash: true
  save_context_text: false  # Avoids dumping raw vector context blocks
  save_context_hash: true
  save_generation_text: true
  record_cost: true
  record_tokens: true
  record_latencies: true
  record_confidence: true


