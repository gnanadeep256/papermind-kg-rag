version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0
    container_name: papermind-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password_123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  streamlit:
    build: .
    container_name: papermind-streamlit
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4j_password_123
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - neo4j
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  neo4j_data:
  neo4j_logs:
